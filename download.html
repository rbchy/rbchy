<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Downloading RBC Portfolio App...</title>
<style>
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
    background:#0a0e1a;
    color:#eef2f9;
    text-align:center;
  }
  .box{max-width:420px;padding:32px;}
  .spinner{
    width:42px;height:42px;border-radius:50%;
    border:4px solid #1f2a45;border-top-color:#2dd4bf;
    margin:0 auto 20px;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  h2{margin:0 0 10px;font-size:1.2rem;}
  p{color:#8b98b3;font-size:.92rem;line-height:1.6;}
  a{color:#2dd4bf;text-decoration:none;font-weight:600;}
</style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h2>Your download is starting…</h2>
    <p>RBC Portfolio for macOS (.dmg) should begin downloading automatically.</p>
    <p>যদি স্বয়ংক্রিয়ভাবে শুরু না হয়, <a id="manual-link" href="#">এখানে ক্লিক করুন</a>।</p>
  </div>

<script>
  // ⚠️ প্রতিবার নতুন রিলিজ (নতুন ভার্সন) পাবলিশ করলে এই URL-টা আপডেট করুন
  var fileUrl = "https://github.com/rbchy/rbchy/releases/download/v1.0.0/RBC.Portfolio-1.0.0-arm64.dmg";

  document.getElementById('manual-link').href = fileUrl;

  window.onload = function () {
    window.location.href = fileUrl;
  };
</script>
</body>
</html>

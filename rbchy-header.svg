<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a6b"/>
      <stop offset="100%" stop-color="#6a2c91"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#ff7ad9"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd86b"/>
      <stop offset="100%" stop-color="#ff9f1c"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <circle cx="1080" cy="40" r="140" fill="#ffffff" opacity="0.05"/>
  <circle cx="1150" cy="270" r="90" fill="#ffffff" opacity="0.05"/>
  <g fill="#ffffff" opacity="0.08">
    <circle cx="700" cy="60" r="3"/><circle cx="760" cy="230" r="2"/>
    <circle cx="980" cy="160" r="3"/><circle cx="880" cy="80" r="2"/>
    <circle cx="1040" cy="210" r="2"/>
  </g>

  <!-- tools icon: gear + wrench -->
  <g transform="translate(160,150)">
    <circle r="105" fill="#ffffff" opacity="0.08"/>
    <!-- gear -->
    <g fill="url(#accent)">
      <g id="tooth"><rect x="-11" y="-80" width="22" height="28" rx="4"/></g>
      <use href="#tooth" transform="rotate(45)"/>
      <use href="#tooth" transform="rotate(90)"/>
      <use href="#tooth" transform="rotate(135)"/>
      <use href="#tooth" transform="rotate(180)"/>
      <use href="#tooth" transform="rotate(225)"/>
      <use href="#tooth" transform="rotate(270)"/>
      <use href="#tooth" transform="rotate(315)"/>
      <circle r="58"/>
    </g>
    <circle r="22" fill="#203a6b"/>
    <!-- wrench -->
    <g transform="rotate(45)" fill="url(#metal)" stroke="#16264a" stroke-width="3" stroke-linejoin="round">
      <rect x="-9" y="-30" width="18" height="115" rx="9"/>
      <path d="M -9 -64.2 A 24 24 0 1 0 9 -64.2 L 9 -38 L -9 -38 Z"/>
    </g>
  </g>

  <!-- text -->
  <text x="300" y="135" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="86" font-weight="800" fill="#ffffff" letter-spacing="2">RBChy</text>
  <text x="304" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="600" fill="url(#accent)">Ranajit Chowdhury</text>
  <rect x="304" y="210" width="380" height="4" rx="2" fill="url(#accent)"/>
  <text x="304" y="248" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#d6e4ff">QA Automation Engineer  •  Pharma Packaging Production</text>
</svg>

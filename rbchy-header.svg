<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b2a33"/>
      <stop offset="55%" stop-color="#0f3d4a"/>
      <stop offset="100%" stop-color="#0d5c5c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2cc2b2"/>
      <stop offset="100%" stop-color="#7ee8d8"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd86b"/>
      <stop offset="100%" stop-color="#ffb020"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <circle cx="600" cy="-40" r="260" fill="#2cc2b2" opacity="0.07"/>
  <circle cx="1150" cy="280" r="110" fill="#ffffff" opacity="0.04"/>

  <!-- tools icon: gear + wrench -->
  <g transform="translate(150,150)">
    <circle r="102" fill="#ffffff" opacity="0.07"/>
    <g fill="url(#accent)">
      <g id="tooth"><rect x="-11" y="-80" width="22" height="28" rx="4"/></g>
      <use href="#tooth" transform="rotate(45)"/>
      <use href="#tooth" transform="rotate(90)"/>
      <use href="#tooth" transform="rotate(135)"/>
      <use href="#tooth" transform="rotate(180)"/>
      <use href="#tooth" transform="rotate(225)"/>
      <use href="#tooth" transform="rotate(270)"/>
      <use href="#tooth" transform="rotate(315)"/>
      <circle r="58"/>
    </g>
    <circle r="22" fill="#0f3d4a"/>
    <g transform="rotate(45)" fill="url(#metal)" stroke="#0b2a33" stroke-width="3" stroke-linejoin="round">
      <rect x="-9" y="-30" width="18" height="115" rx="9"/>
      <path d="M -9 -64.2 A 24 24 0 1 0 9 -64.2 L 9 -38 L -9 -38 Z"/>
    </g>
  </g>

  <!-- name -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="285" y="130" font-size="80" font-weight="800" fill="#ffffff" letter-spacing="2">RBChy</text>
    <text x="289" y="182" font-size="36" font-weight="600" fill="url(#accent)">Ranajit Chowdhury</text>
    <rect x="289" y="202" width="330" height="4" rx="2" fill="#ffc107"/>
    <text x="289" y="240" font-size="21" fill="#cfe9e5">QA Automation Engineer / SDET</text>
  </g>

  <!-- tool chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    <g transform="translate(800,60)">
      <rect width="170" height="46" rx="23" fill="#43b02a"/><text x="85" y="30" fill="#fff">Selenium</text>
    </g>
    <g transform="translate(990,60)">
      <rect width="170" height="46" rx="23" fill="#2ead33"/><text x="85" y="30" fill="#fff">Playwright</text>
    </g>
    <g transform="translate(800,127)">
      <rect width="170" height="46" rx="23" fill="#69d3a7"/><text x="85" y="30" fill="#0b2a33">Cypress</text>
    </g>
    <g transform="translate(990,127)">
      <rect width="170" height="46" rx="23" fill="#7b5cff"/><text x="85" y="30" fill="#fff">Appium</text>
    </g>
    <g transform="translate(800,194)">
      <rect width="170" height="46" rx="23" fill="#23d96c"/><text x="85" y="30" fill="#0b2a33">Cucumber</text>
    </g>
    <g transform="translate(990,194)">
      <rect width="170" height="46" rx="23" fill="#f89820"/><text x="85" y="30" fill="#0b2a33">Java</text>
    </g>
  </g>
</svg>
